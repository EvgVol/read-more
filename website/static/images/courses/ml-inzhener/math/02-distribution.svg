<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Вероятности и распределения</title>
  <desc id="d">Распределение описывает, какие значения вероятнее; среднее и стандартное отклонение фиксируют центр и разброс.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Вероятности и распределения</text>
  <g font-family="Arial, Helvetica, sans-serif">
<path d="M110 250 C 220 250 250 110 400 110 C 550 110 580 250 690 250" fill="none" stroke="#2563eb" stroke-width="5"/>
<line x1="90" y1="250" x2="710" y2="250" stroke="#64748b" stroke-width="2.5"/>
<line x1="400" y1="110" x2="400" y2="250" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 6"/>
<text x="400" y="96" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="700">μ (среднее)</text>
<line x1="300" y1="250" x2="300" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="500" y1="250" x2="500" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="4 5"/>
<text x="300" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569" text-anchor="middle">−σ</text>
<text x="500" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569" text-anchor="middle">+σ</text>
<path d="M300 250 C 340 250 360 175 400 110 C 440 175 460 250 500 250 Z" fill="#dbeafe" fill-opacity="0.8"/>
<rect x="760" y="110" width="190" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="855" y="150" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">P(x≤μ) = 0.5</text>
<text x="855" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">σ — разброс</text>
<text x="855" y="210" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">хвосты — редкое</text>
<text x="855" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Гауссово</text>
  </g>
</svg>
