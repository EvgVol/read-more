<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Статистические оценки</title>
  <desc id="d">По случайной выборке оцениваем параметр популяции; точность растёт с размером выборки.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Статистические оценки</text>
  <g font-family="Arial, Helvetica, sans-serif">
<path d="M90 240 C 200 240 230 120 360 120 C 490 120 520 240 630 240" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
<text x="120" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">популяция</text>
<circle cx="300" cy="195" r="6" fill="#2563eb"/>
<circle cx="330" cy="150" r="6" fill="#2563eb"/>
<circle cx="360" cy="130" r="6" fill="#2563eb"/>
<circle cx="390" cy="150" r="6" fill="#2563eb"/>
<circle cx="420" cy="195" r="6" fill="#2563eb"/>
<circle cx="450" cy="160" r="6" fill="#2563eb"/>
<text x="375" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">выборка (n)</text>
<line x1="300" y1="285" x2="450" y2="285" stroke="#16a34a" stroke-width="8"/>
<line x1="375" y1="272" x2="375" y2="298" stroke="#16a34a" stroke-width="4"/>
<text x="375" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">оценка μ̂ ± доверительный интервал</text>
<rect x="690" y="120" width="250" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="815" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">чем больше n,</text>
<text x="815" y="188" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">тем уже интервал</text>
<text x="815" y="218" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">и точнее оценка</text>
  </g>
</svg>
