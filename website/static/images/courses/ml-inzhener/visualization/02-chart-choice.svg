<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Выбор типа графика</title>
  <desc id="desc">Исследовательский вопрос определяет подходящий тип графика.</desc>
  <rect width="1200" height="620" rx="32" fill="#fbfcfe"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Вопрос определяет график</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="185" width="300" height="210" rx="22" fill="#e9f2ff" stroke="#2d6cdf" stroke-width="3"/>
    <text x="105" y="240" font-size="24" font-weight="700" fill="#174ea6">Сравнить группы?</text>
    <text x="105" y="292" font-size="20" fill="#172033">Столбчатая диаграмма</text>
    <text x="105" y="328" font-size="18" fill="#4d5b73">Упорядочите категории</text>
    <rect x="450" y="185" width="300" height="210" rx="22" fill="#eef9f1" stroke="#269c56" stroke-width="3"/>
    <text x="485" y="240" font-size="24" font-weight="700" fill="#1f7a43">Показать время?</text>
    <text x="485" y="292" font-size="20" fill="#172033">Линейный график</text>
    <text x="485" y="328" font-size="18" fill="#4d5b73">Сохраните порядок дат</text>
    <rect x="830" y="185" width="300" height="210" rx="22" fill="#fff7e8" stroke="#dc8b19" stroke-width="3"/>
    <text x="865" y="240" font-size="24" font-weight="700" fill="#a36200">Изучить форму?</text>
    <text x="865" y="292" font-size="20" fill="#172033">Histogram или boxplot</text>
    <text x="865" y="328" font-size="18" fill="#4d5b73">Покажите разброс</text>
  </g>
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="22" fill="#172033">Не начинайте с цвета и стиля: сначала определите исследовательский вопрос.</text>
</svg>
