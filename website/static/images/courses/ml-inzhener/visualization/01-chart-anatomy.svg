<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Анатомия понятного графика</title>
  <desc id="desc">Вопрос, оси, данные и вывод связаны в последовательный путь чтения графика.</desc>
  <rect width="1200" height="620" rx="32" fill="#f6f8fb"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Как читать график</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="20" fill="#4d5b73">Четыре проверки перед тем, как делать вывод</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="180" width="235" height="270" rx="20" fill="#e9f2ff" stroke="#2d6cdf" stroke-width="3"/>
    <text x="100" y="230" font-size="25" font-weight="700" fill="#174ea6">1. Вопрос</text>
    <text x="100" y="278" font-size="19" fill="#172033">Что сравниваем?</text>
    <text x="100" y="312" font-size="19" fill="#172033">За какой период?</text>
    <text x="100" y="346" font-size="19" fill="#172033">Для кого вывод?</text>
    <rect x="335" y="180" width="235" height="270" rx="20" fill="#eef9f1" stroke="#269c56" stroke-width="3"/>
    <text x="365" y="230" font-size="25" font-weight="700" fill="#1f7a43">2. Оси</text>
    <text x="365" y="278" font-size="19" fill="#172033">Единицы измерения</text>
    <text x="365" y="312" font-size="19" fill="#172033">Масштаб и диапазон</text>
    <text x="365" y="346" font-size="19" fill="#172033">Подписи и порядок</text>
    <rect x="600" y="180" width="235" height="270" rx="20" fill="#fff7e8" stroke="#dc8b19" stroke-width="3"/>
    <text x="630" y="230" font-size="25" font-weight="700" fill="#a36200">3. Данные</text>
    <text x="630" y="278" font-size="19" fill="#172033">Размер выборки</text>
    <text x="630" y="312" font-size="19" fill="#172033">Пропуски и выбросы</text>
    <text x="630" y="346" font-size="19" fill="#172033">Агрегирование</text>
    <rect x="865" y="180" width="265" height="270" rx="20" fill="#f7edff" stroke="#8a45b8" stroke-width="3"/>
    <text x="895" y="230" font-size="25" font-weight="700" fill="#6d2e99">4. Вывод</text>
    <text x="895" y="278" font-size="19" fill="#172033">Один проверяемый тезис</text>
    <text x="895" y="312" font-size="19" fill="#172033">Ограничения</text>
    <text x="895" y="346" font-size="19" fill="#172033">Следующая проверка</text>
  </g>
  <path d="M305 315h30M570 315h30M835 315h30" stroke="#172033" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#172033"/></marker></defs>
</svg>
