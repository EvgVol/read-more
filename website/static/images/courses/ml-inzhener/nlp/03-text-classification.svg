<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Классификация текстов</title>
  <desc id="d">Модель превращает текст в эмбеддинг и выдаёт вероятности классов для автоматического решения.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Классификация текстов</text>
  <g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="110" width="180" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="160" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">документ</text>
<text x="160" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">отзыв / заявка</text>
<line x1="250" y1="170" x2="320" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M320 170 L307.2 175.7 L307.2 164.3 Z" fill="#64748b"/>
<rect x="320" y="110" width="200" height="120" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
<text x="420" y="165" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle" font-weight="700">классификатор</text>
<text x="420" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">(с эмбеддингом)</text>
<line x1="520" y1="170" x2="590" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M590 170 L577.2 175.7 L577.2 164.3 Z" fill="#64748b"/>
<rect x="590" y="110" width="180" height="42" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="680" y="138" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">спам 0.9</text>
<rect x="590" y="162" width="180" height="42" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="680" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">норм 0.1</text>
<rect x="590" y="214" width="180" height="42" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="680" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">важный 0.4</text>
<text x="680" y="285" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569" text-anchor="middle">softmax → вероятности классов</text>
<rect x="800" y="120" width="140" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="870" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">решение</text>
<text x="870" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">по порогу</text>
<line x1="770" y1="170" x2="800" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M800 170 L787.2 175.7 L787.2 164.3 Z" fill="#64748b"/>
  </g>
</svg>
