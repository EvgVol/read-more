<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Эмбеддинги и трансформеры</title>
  <desc id="d">Слова становятся векторами, близкими по смыслу; трансформеры учитывают контекст через механизм внимания.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Эмбеддинги и трансформеры</text>
  <g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="110" width="150" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="145" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">слово</text>
<text x="145" y="180" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">→ вектор</text>
<text x="145" y="210" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">(embedding)</text>
<line x1="220" y1="170" x2="300" y2="170" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M300 170 L287.2 175.7 L287.2 164.3 Z" fill="#64748b"/>
<circle cx="420" cy="180" r="105" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
<text x="420" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569" text-anchor="middle">пространство смыслов</text>
<circle cx="390" cy="150" r="7" fill="#4f46e5"/>
<circle cx="450" cy="150" r="7" fill="#4f46e5"/>
<circle cx="420" cy="215" r="7" fill="#4f46e5"/>
<text x="390" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155" text-anchor="middle">король</text>
<text x="455" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle">королева</text>
<text x="420" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155" text-anchor="middle">человек</text>
<line x1="525" y1="180" x2="600" y2="180" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M600 180 L587.2 185.7 L587.2 174.3 Z" fill="#64748b"/>
<rect x="600" y="110" width="330" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="765" y="145" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155" text-anchor="middle" font-weight="700">Трансформер</text>
<text x="765" y="180" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">внимание: слово учитывает</text>
<text x="765" y="208" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">весь контекст сразу</text>
  </g>
</svg>
