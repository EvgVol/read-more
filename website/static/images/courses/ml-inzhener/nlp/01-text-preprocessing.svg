<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Предобработка текста</title>
  <desc id="d">Текст превращают в числовой формат: нормализация, токенизация, очистка от шума.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Предобработка текста</text>
  <g font-family="Arial, Helvetica, sans-serif">
<rect x="60" y="120" width="155" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="137" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">Текст</text>
<line x1="215" y1="165" x2="243" y2="165" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M243 165 L230.2 170.7 L230.2 159.3 Z" fill="#64748b"/>
<rect x="243" y="120" width="155" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="320" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">Нормализация</text>
<line x1="398" y1="165" x2="426" y2="165" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M426 165 L413.2 170.7 L413.2 159.3 Z" fill="#64748b"/>
<rect x="426" y="120" width="155" height="90" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
<text x="503" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">Токенизация</text>
<line x1="581" y1="165" x2="609" y2="165" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M609 165 L596.2 170.7 L596.2 159.3 Z" fill="#64748b"/>
<rect x="609" y="120" width="155" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="686" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">Очистка</text>
<line x1="764" y1="165" x2="792" y2="165" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M792 165 L779.2 170.7 L779.2 159.3 Z" fill="#64748b"/>
<rect x="792" y="120" width="155" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="869" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">Числовой ввод</text>
<text x="500" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">lowercase → split → стоп-слова/опечатки → вектор для модели</text>
<rect x="70" y="280" width="860" height="34" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="500" y="303" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569" text-anchor="middle">каждый шаг — проверяемая трансформация с сохранением смысла</text>
  </g>
</svg>
