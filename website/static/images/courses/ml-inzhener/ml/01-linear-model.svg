<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Линейные модели</title>
  <desc id="d">Модель ищет прямую (гиперплоскость): коэффициенты w и смещение b выбирают минимизацией потерь.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Линейные модели</text>
  <g font-family="Arial, Helvetica, sans-serif">
<line x1="90" y1="280" x2="620" y2="280" stroke="#64748b" stroke-width="2.5"/>
<line x1="90" y1="280" x2="90" y2="90" stroke="#64748b" stroke-width="2.5"/>
<circle cx="140" cy="240" r="7" fill="#2563eb"/>
<circle cx="220" cy="215" r="7" fill="#2563eb"/>
<circle cx="300" cy="205" r="7" fill="#2563eb"/>
<circle cx="380" cy="160" r="7" fill="#2563eb"/>
<circle cx="460" cy="130" r="7" fill="#2563eb"/>
<circle cx="540" cy="110" r="7" fill="#2563eb"/>
<line x1="120" y1="250" x2="560" y2="100" stroke="#dc2626" stroke-width="4"/>
<text x="575" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="700">ŷ = w·x + b</text>
<text x="350" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">признак x</text>
<text x="60" y="200" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="start">y</text>
<rect x="680" y="105" width="260" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="810" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">L1 (Lasso): часть w = 0</text>
<text x="810" y="179" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">L2 (Ridge): w поменьше</text>
<text x="810" y="213" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle">регуляризация = контроль переобучения</text>
  </g>
</svg>
