<text x="310" y="312" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">сетка гиперпараметров: зелёный — лучший score на valid</text>
<rect x="640" y="100" width="300" height="180" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="790" y="135" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle" font-weight="700">честный отбор</text>
<text x="790" y="170" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">1) train → подобрать</text>
<text x="790" y="200" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">2) validation → выбрать</text>
<text x="790" y="230" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">3) test → один раз, финал</text>
