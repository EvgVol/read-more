<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Деревья и ансамбли</title>
  <desc id="d">Дерево делит пространство по признакам; ансамбли усредняют ошибки и дают важность признаков.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Деревья и ансамбли</text>
  <g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="95" width="150" height="60" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="145" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">x₂ > 5?</text>
<rect x="70" y="225" width="110" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="125" y="261" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">нет → 0.2</text>
<rect x="215" y="225" width="110" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="270" y="261" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155" text-anchor="middle">да → 0.9</text>
<line x1="120" y1="155" x2="125" y2="225" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M125 225 L118.4 212.7 L129.8 211.8 Z" fill="#64748b"/>
<line x1="175" y1="155" x2="270" y2="225" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M270 225 L256.3 222.0 L263.1 212.8 Z" fill="#64748b"/>
<text x="180" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Одно дерево — правила по признакам</text>
<rect x="450" y="100" width="75" height="75" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="487" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" text-anchor="middle">дерево 1</text>
<line x1="487" y1="175" x2="790" y2="225" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M790 225 L776.5 228.6 L778.3 217.3 Z" fill="#64748b"/>
<rect x="540" y="100" width="75" height="75" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="577" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" text-anchor="middle">дерево 2</text>
<line x1="577" y1="175" x2="790" y2="225" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M790 225 L776.3 227.6 L778.9 216.5 Z" fill="#64748b"/>
<rect x="630" y="100" width="75" height="75" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
<text x="667" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155" text-anchor="middle">дерево 3</text>
<line x1="667" y1="175" x2="790" y2="225" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M790 225 L776.0 225.5 L780.3 214.9 Z" fill="#64748b"/>
<rect x="760" y="200" width="180" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="850" y="232" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle" font-weight="700">среднее</text>
<text x="850" y="258" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">глубина / bootstrap</text>
<text x="560" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Ансамбль (Random Forest) сильнее одного дерева</text>
  </g>
</svg>
