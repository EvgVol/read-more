<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Мониторинг и обновление моделей</title>
  <desc id="d">После релиза следим за качеством и дрейфом данных; по сигналу перетренируем или откатим модель.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">Мониторинг и обновление моделей</text>
  <g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="110" width="220" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
<text x="180" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">модель в проде</text>
<text x="180" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" text-anchor="middle">предсказания</text>
<line x1="290" y1="165" x2="370" y2="165" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M370 165 L357.2 170.7 L357.2 159.3 Z" fill="#64748b"/>
<rect x="370" y="110" width="240" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="490" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">мониторинг</text>
<text x="490" y="178" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" text-anchor="middle">качество + дрейф</text>
<text x="490" y="206" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" text-anchor="middle">входов и выходов</text>
<line x1="610" y1="165" x2="690" y2="165" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M690 165 L677.2 170.7 L677.2 159.3 Z" fill="#64748b"/>
<rect x="690" y="110" width="240" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="810" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">решение</text>
<text x="810" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" text-anchor="middle">перетренировать</text>
<text x="810" y="206" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" text-anchor="middle">или откатить</text>
<path d="M810 220 C 810 300 180 300 180 220" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="9 6"/>
<line x1="190" y1="265" x2="180" y2="224" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><path d="M180 224 L188.6 235.1 L177.5 237.8 Z" fill="#7c3aed"/>
<text x="500" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#7c3aed" text-anchor="middle">цикл обратной связи: данные → новая версия модели</text>
  </g>
</svg>
