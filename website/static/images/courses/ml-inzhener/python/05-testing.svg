<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Цикл тестирования</title><desc id="desc">Arrange подготавливает фикстуру, Act вызывает функцию, Assert проверяет результат; цикл повторяется для успеха и ошибки.</desc><rect width="1000" height="330" rx="24" fill="#f7f8fc"/><text x="48" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#202938">Тест проверяет контракт, а не внутренности</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><g fill="#dfe6ff" stroke="#3857d6"><circle cx="190" cy="170" r="78"/><circle cx="500" cy="170" r="78"/><circle cx="810" cy="170" r="78"/></g><g fill="#202938"><text x="190" y="165">ARRANGE</text><text x="190" y="192">fixture</text><text x="500" y="165">ACT</text><text x="500" y="192">call</text><text x="810" y="165">ASSERT</text><text x="810" y="192">result/error</text></g><g stroke="#3857d6" stroke-width="4" fill="none"><path d="M270 170h145m170 0h145"/><path d="m405 162 10 8-10 8m170 0 10-8-10-8"/></g></g></svg>
