<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Пропуск или ноль</title><desc id="desc">Три значения: пустая ячейка, None и ноль; для идентификатора пропуск является ошибкой, для комментария допустим, сумма требует отдельного правила.</desc><rect width="900" height="360" rx="24" fill="#f7f8fc"/><text x="48" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#202938">Одинаковый вид не означает одинаковый смысл</text><g font-family="sans-serif"><g><rect x="55" y="105" width="230" height="190" rx="16" fill="#fff0f0" stroke="#d64b4b"/><text x="170" y="150" text-anchor="middle" font-size="28" fill="#a52f2f">'' / None</text><text x="80" y="200" font-size="19" fill="#202938">order_id → ошибка</text><text x="80" y="240" font-size="19" fill="#202938">comment → допустимо</text></g><g><rect x="335" y="105" width="230" height="190" rx="16" fill="#fff8df" stroke="#c58b00"/><text x="450" y="150" text-anchor="middle" font-size="28" fill="#795600">0</text><text x="360" y="200" font-size="19" fill="#202938">это значение</text><text x="360" y="240" font-size="19" fill="#202938">не пропуск</text></g><g><rect x="615" y="105" width="230" height="190" rx="16" fill="#e9f8ef" stroke="#2a8b52"/><text x="730" y="150" text-anchor="middle" font-size="28" fill="#176238">правило</text><text x="640" y="200" font-size="19" fill="#202938">выбираем по смыслу</text><text x="640" y="240" font-size="19" fill="#202938">и фиксируем тестом</text></g></g></svg>
