<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Обработка исключения</title><desc id="desc">Функция поднимает типизированную ошибку, CLI добавляет контекст, stderr получает сообщение и процесс возвращает ненулевой код.</desc><rect width="1000" height="330" rx="24" fill="#f7f8fc"/><text x="48" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#202938">Ошибка остаётся видимой на всём пути</text><g font-family="sans-serif" font-size="19" text-anchor="middle"><g fill="#e9f8ef" stroke="#2a8b52"><rect x="35" y="120" width="210" height="85" rx="14"/><rect x="285" y="120" width="210" height="85" rx="14"/><rect x="535" y="120" width="180" height="85" rx="14"/><rect x="755" y="120" width="210" height="85" rx="14"/></g><g fill="#202938"><text x="140" y="155">parse_order</text><text x="140" y="182">raise InvalidOrderError</text><text x="390" y="155">CLI catches</text><text x="390" y="182">line + reason</text><text x="625" y="155">stderr</text><text x="625" y="182">diagnostic</text><text x="860" y="155">exit code != 0</text><text x="860" y="182">no partial JSON</text></g><g stroke="#2a8b52" stroke-width="4"><path d="M245 162h40m210 0h40m180 0h40"/><path d="m275 154 10 8-10 8m250 0 10-8-10-8m220 0 10 8-10 8"/></g></g></svg>
