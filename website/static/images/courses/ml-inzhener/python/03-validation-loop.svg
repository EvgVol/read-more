<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Цикл проверки результата</title>
  <desc id="desc">Цикл из пяти шагов: гипотеза, код, тест, метрика и вывод.</desc>
  <rect width="1000" height="520" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="4">
      <circle cx="500" cy="95" r="65"/>
      <circle cx="790" cy="205" r="65"/>
      <circle cx="680" cy="405" r="65"/>
      <circle cx="320" cy="405" r="65"/>
      <circle cx="210" cy="205" r="65"/>
    </g>
    <g fill="#0f172a" font-size="24" font-weight="700">
      <text x="500" y="90"><tspan x="500">Гипотеза</tspan><tspan x="500" dy="30">что проверяем?</tspan></text>
      <text x="790" y="200"><tspan x="790">Код</tspan><tspan x="790" dy="30">малый шаг</tspan></text>
      <text x="680" y="400"><tspan x="680">Тест</tspan><tspan x="680" dy="30">границы</tspan></text>
      <text x="320" y="400"><tspan x="320">Метрика</tspan><tspan x="320" dy="30">что изменилось?</tspan></text>
      <text x="210" y="200"><tspan x="210">Вывод</tspan><tspan x="210" dy="30">что дальше?</tspan></text>
    </g>
    <g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M560 120 735 180M770 270 710 340M620 405H380M270 350 230 270M255 170 440 120"/>
    </g>
    <g fill="#475569">
      <path d="m725 170 20 10-19 13zM700 330l17 13-20 8zM390 395l-20 10 20 10zM220 285l-10-20 20 7zM425 115l20 4-14 16z"/>
    </g>
    <text x="500" y="495" fill="#475569" font-size="21">Один эксперимент — одно изменение и записанный результат</text>
  </g>
</svg>
