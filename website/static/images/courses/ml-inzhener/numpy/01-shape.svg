<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Shape: объекты и признаки</title><desc id="desc">Матрица из 3 строк объектов и 2 колонок признаков имеет shape 3 на 2.</desc><rect width="900" height="360" rx="24" fill="#f7f8fc"/><text x="48" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#202938">X.shape = (n_samples, n_features)</text><g stroke="#3857d6" stroke-width="3" fill="#dfe6ff"><rect x="120" y="110" width="130" height="58"/><rect x="250" y="110" width="130" height="58"/><rect x="120" y="168" width="130" height="58"/><rect x="250" y="168" width="130" height="58"/><rect x="120" y="226" width="130" height="58"/><rect x="250" y="226" width="130" height="58"/></g><g font-family="sans-serif" font-size="21" fill="#202938"><text x="185" y="145" text-anchor="middle">объект 1</text><text x="315" y="145" text-anchor="middle">признак 1</text><text x="185" y="203" text-anchor="middle">объект 2</text><text x="315" y="203" text-anchor="middle">признак 2</text><text x="185" y="261" text-anchor="middle">объект 3</text><text x="560" y="175">3 строки → n_samples = 3</text><text x="560" y="220">2 колонки → n_features = 2</text><text x="560" y="265">shape = (3, 2)</text></g></svg>
