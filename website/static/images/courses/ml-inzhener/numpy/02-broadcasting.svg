<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Broadcasting по оси признаков</title><desc id="desc">Вектор среднего формы 2 применяется к каждой строке матрицы формы 3 на 2.</desc><rect width="1000" height="330" rx="24" fill="#f7f8fc"/><text x="45" y="54" font-family="sans-serif" font-size="27" font-weight="700" fill="#202938">X (3×2) − mean (2,) → centered (3×2)</text><g font-family="sans-serif" font-size="20" text-anchor="middle"><g fill="#dfe6ff" stroke="#3857d6"><rect x="50" y="105" width="210" height="120" rx="12"/><rect x="365" y="135" width="150" height="60" rx="12"/><rect x="620" y="105" width="210" height="120" rx="12"/></g><g fill="#202938"><text x="155" y="145">X</text><text x="155" y="180">3 строки × 2</text><text x="440" y="170">mean</text><text x="440" y="195">2 значения</text><text x="725" y="145">centered</text><text x="725" y="180">3 строки × 2</text></g><g stroke="#3857d6" stroke-width="4"><path d="M260 165h100m155 0h100"/><path d="m350 157 10 8-10 8m155 0 10-8-10-8"/></g></g></svg>
