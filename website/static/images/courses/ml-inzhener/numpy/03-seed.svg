<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Воспроизводимый случайный эксперимент</title><desc id="desc">Один seed создаёт одинаковую последовательность случайных чисел при повторном запуске.</desc><rect width="1000" height="300" rx="24" fill="#f7f8fc"/><text x="45" y="55" font-family="sans-serif" font-size="27" font-weight="700" fill="#202938">rng(seed=42) → одинаковый эксперимент</text><g font-family="sans-serif" font-size="20" text-anchor="middle"><g fill="#e9f8ef" stroke="#2a8b52"><rect x="80" y="110" width="220" height="75" rx="14"/><rect x="390" y="110" width="220" height="75" rx="14"/><rect x="700" y="110" width="220" height="75" rx="14"/></g><g fill="#202938"><text x="190" y="145">seed = 42</text><text x="190" y="172">rng.random()</text><text x="500" y="145">run 1</text><text x="500" y="172">[0.77, 0.44, ...]</text><text x="810" y="145">run 2</text><text x="810" y="172">[0.77, 0.44, ...]</text></g><g stroke="#2a8b52" stroke-width="4"><path d="M300 148h80m220 0h80"/><path d="m370 140 10 8-10 8m300 0 10-8-10-8"/></g></g></svg>
