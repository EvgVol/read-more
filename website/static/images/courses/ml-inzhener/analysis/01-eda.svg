<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">EDA: исследовательский анализ</title>
  <desc id="d">До модели изучаем данные: профили, распределения, связи — и формулируем гипотезы.</desc>
  <rect width="1000" height="340" rx="20" fill="#f7f8fc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202938">EDA: исследовательский анализ</text>
  <g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="135" width="160" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="150" y="175" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">Данные</text>
<text x="150" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">сырые, новые</text>
<rect x="280" y="95" width="440" height="190" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
<text x="300" y="85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569" text-anchor="start">EDA — исследование до модели</text>
<rect x="300" y="115" width="190" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="395" y="157" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">Профилирование</text>
<rect x="510" y="115" width="190" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="605" y="157" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">Распределения</text>
<rect x="300" y="205" width="190" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="395" y="247" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">Корреляции</text>
<rect x="510" y="205" width="190" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="605" y="247" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">Выбросы</text>
<rect x="770" y="135" width="160" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="850" y="175" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">Гипотезы</text>
<text x="850" y="203" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155" text-anchor="middle">проверяемые</text>
<line x1="230" y1="185" x2="280" y2="185" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M280 185 L267.2 190.7 L267.2 179.3 Z" fill="#64748b"/>
<line x1="720" y1="185" x2="770" y2="185" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><path d="M770 185 L757.2 190.7 L757.2 179.3 Z" fill="#64748b"/>
<text x="500" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Наблюдения превращаются в проверяемые гипотезы до моделирования</text>
  </g>
</svg>
